# Shared infrastructure: MySQL + Redis + MinIO + Elasticsearch + PostgreSQL
# (Standalone Compose project, shared across all local services)
#
# Start:
#   docker compose -p infra -f ./infra/docker-compose.yml up -d
#
# Isolation strategy:
#   - MySQL (3306): one database (schema) per project
#     * eleccloud
#     * ragflow
#     * kms
#     * n9e_v6 (Nightingale monitoring)
#   - PostgreSQL (5432):
#     * coolify (user: postgres, password: 123456, db: coolify)
#   - Redis (6379): one db index per project (0~15)
#     * db 0 = Demo app SDK delay queue
#     * db 1 = eleccloud server/admin spring.redis
#     * db 2 = eleccloud server/admin Redisson (distributed lock / delay queue)
#     * db 4 = RAGFlow
#     * db 5 = Nightingale monitoring
#   - MinIO (API: 9000, Console: 9001): one bucket per project
#     * credentials: minioadmin / minioadmin
#     * buckets: ragflow, eleccloud, jkkms, etc.
#   - Elasticsearch (9200):
#     * Used by RAGFlow for document vector search and full-text indexing
#   - RabbitMQ (AMQP: 5672, Console: 15672):
#     * credentials: admin / 123456
#     * includes x-delayed-message plugin for ElecCloud retry message delivery
#
version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: shared-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - shared-mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shared-network

  redis:
    image: redis:6-alpine
    container_name: shared-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "123456"]
    ports:
      - "6379:6379"
    volumes:
      - shared-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shared-network

  minio:
    image: minio/minio:latest
    container_name: shared-minio
    restart: unless-stopped
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Shanghai
    volumes:
      - shared-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - shared-network

  elasticsearch:
    image: elasticsearch:8.11.3
    container_name: shared-elasticsearch
    restart: unless-stopped
    environment:
      - node.name=es01
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
      - ES_JAVA_OPTS=-Xms1g -Xmx2g
      - TZ=Asia/Shanghai
    ports:
      - "9200:9200"
    volumes:
      - shared-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - shared-network

  postgres:
    image: postgres:15-alpine
    container_name: shared-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: coolify
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - shared-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coolify"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shared-network

  rabbitmq:
    image: heidiks/rabbitmq-delayed-message-exchange:latest
    container_name: shared-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: "123456"
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"     # AMQP 通信端口
      - "15672:15672"   # Management Web 控制台管理界面
    volumes:
      - shared-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - shared-network

volumes:
  shared-mysql-data:
  shared-redis-data:
  shared-minio-data:
  shared-es-data:
  shared-postgres-data:
  shared-rabbitmq-data:

networks:
  shared-network:
    name: shared-network

