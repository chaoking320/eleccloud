# 应用容器连接配置（接入公共 MySQL/Redis 时使用）
# admin 引入了整个 retry-server 包，与 server 共享同一 MySQL / Redis / Redisson 延时队列，
# 作为分布式集群的第二个消费者协同工作。
#
# 密码需与 infra 里 MYSQL_ROOT_PASSWORD / redis requirepass 保持一致。
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/retry_platform?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
    username: root
    password: ChangeMe2026
  redis:
    host: redis
    port: 6379
    database: 1
    password: ChangeMe2026
    redisson:
      config: |
        singleServerConfig:
          address: "redis://redis:6379"
          password: "ChangeMe2026"
          database: 2
          connectionPoolSize: 64
          connectionMinimumIdleSize: 10
