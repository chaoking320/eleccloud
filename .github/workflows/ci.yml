name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Build and run unit tests
        # Skip integration tests that require Docker/MySQL/Redis infrastructure
        # Integration tests: *IntegrationTest, *RecoveryTest
        run: mvn -B clean test -Dtest='!*IntegrationTest,!*RecoveryTest'
