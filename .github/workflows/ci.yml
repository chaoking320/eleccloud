name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Build and run unit tests
        # RetryPlatformIntegrationTest 依赖 Redis / MySQL，本地/CI 无中间件时跳过；
        # 其余纯单元测试（退避策略、参数提取、状态机守卫）照常执行。
        run: mvn -B test -Dtest='!RetryPlatformIntegrationTest'
