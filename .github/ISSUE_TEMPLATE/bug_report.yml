name: Bug Report
description: 报告一个缺陷或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈问题！请尽量提供可复现的信息，便于我们快速定位。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰、简洁地描述出现了什么异常。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 一步步说明如何复现该问题。
      placeholder: |
        1. 配置 ...
        2. 调用 ...
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 版本、JDK、MQ 类型（Redis/RabbitMQ）、部署方式等。
      placeholder: |
        - ElecCloud 版本：1.0.0
        - JDK：8
        - MQ：Redis 6.x
        - 部署：docker-compose
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 堆栈
      description: 粘贴相关日志或异常堆栈（请脱敏）。
      render: shell
    validations:
      required: false
