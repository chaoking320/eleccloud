name: Feature Request
description: 提出一个新特性或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题 / 场景
      description: 你遇到了什么场景，现有能力无法满足？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望如何解决这个问题？可以描述期望的 API / 配置 / 行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现方式？
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 任何有助于理解该需求的背景或参考资料。
    validations:
      required: false
