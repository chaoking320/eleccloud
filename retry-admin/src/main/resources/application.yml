server:
  port: 8081

spring:
  application:
    name: retry-admin
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/retry_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  
  redis:
    host: 127.0.0.1
    port: 6379
    password: 123456
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
    redisson:
      config: |
        singleServerConfig:
          address: "redis://127.0.0.1:6379"
          password: "123456"
          database: 2
          connectionPoolSize: 64
          connectionMinimumIdleSize: 10

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.retry.platform.server.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 重试客户端配置
retry:
  client:
    consumer-enabled: false  # 控制台不执行本地重试消费

# 日志配置
logging:
  level:
    com.retry.platform: INFO
    org.springframework: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
