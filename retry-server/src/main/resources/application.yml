server:
  port: 8080

spring:
  application:
    name: retry-server
  
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/retry_platform?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&rewriteBatchedStatements=true&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: 127.0.0.1
    port: 6379
    database: 1
    password: 123456
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: 100
    redisson:
      config: |
        singleServerConfig:
          # 注意：这里是 "address"，不是 "host" 和 "port" 分开
          address: "redis://127.0.0.1:6379"
          password: "123456"
          database: 2
          connectionPoolSize: 64  # 注意命名：connectionPoolSize 不是 connection-pool-size
          connectionMinimumIdleSize: 10  # 注意命名

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.retry.platform.server.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

