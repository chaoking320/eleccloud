# 重试平台配置
retry:
  client:
    consumer-enabled: false  # 服务端只调度/触发消息，不执行本地重试消费
  scheduler:
    enabled: true
    scan-interval: 10000  # 扫描间隔(ms)
    batch-size: 100       # 每次处理任务数
    fallback-scan-interval: 60000  # 数据库兜底扫描间隔(ms)，默认1分钟
  executor:
    core-pool-size: 10
    max-pool-size: 50
    queue-capacity: 1000
    thread-name-prefix: retry-executor-

# Actuator配置
management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

# 日志配置
logging:
  level:
    com.retry.platform: INFO
    org.springframework: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
