# ElecCloud deployment for shared middleware (MySQL & Redis)
# Prerequisite: start shared infra via `docker compose -p infra -f infra/docker-compose.yml up -d`
# Start: docker compose -p retry-platform -f docker-compose.shared.yml up -d --build
#
# Connects directly to shared-network using services mysql and redis.
version: "3.8"

services:
  retry-server:
    build:
      context: ./retry-server
      dockerfile: Dockerfile
    container_name: retry-platform-server
    ports:
      - "8080:8080"
    volumes:
      - ./retry-server-shared.yml:/app/config/retry-server-shared.yml:ro
    command: ["--spring.config.additional-location=file:/app/config/retry-server-shared.yml", "--server.port=8080"]
    environment:
      - RETRY_SECURITY_ENABLED=false
    restart: unless-stopped
    networks:
      - shared-network

  retry-admin:
    build:
      context: ./retry-admin
      dockerfile: Dockerfile
    container_name: retry-platform-admin
    ports:
      - "8081:8081"
    volumes:
      - ./retry-admin-shared.yml:/app/config/retry-admin-shared.yml:ro
    command: ["--spring.config.additional-location=file:/app/config/retry-admin-shared.yml", "--server.port=8081"]
    restart: unless-stopped
    networks:
      - shared-network

  retry-example:
    build:
      context: ./retry-example
      dockerfile: Dockerfile
    container_name: retry-platform-example
    ports:
      - "8082:8082"
    depends_on:
      - retry-server
    environment:
      - RETRY_CLIENT_MODE=remote
      - RETRY_CLIENT_SERVER_URL=http://retry-server:8080
      - RETRY_CLIENT_API_KEY=demo-key-12345678
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_PASSWORD=123456
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/retry_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    restart: unless-stopped
    networks:
      - shared-network

networks:
  shared-network:
    external: true
    name: shared-network
