# Container runtime configuration mounted by docker-compose
# Injected via spring.config.additional-location with higher priority than application.yml
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/retry_platform?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
    username: root
    password: password
  redis:
    host: redis
    port: 6379
    database: 1
    password: ""
    redisson:
      config: |
        singleServerConfig:
          address: "redis://redis:6379"
          database: 2
          connectionPoolSize: 64
          connectionMinimumIdleSize: 10
