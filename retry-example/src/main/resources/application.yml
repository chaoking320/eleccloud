server:
  port: 8082

spring:
  application:
    name: retry-example-service
  redis:
    host: 127.0.0.1
    port: 6379
    password: 123456
    database: 0
  # MySQL 数据源（Standalone 模式需要，在你的业务数据库中建表）
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/retry_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 允许异步 SSE 推送
  mvc:
    async:
      request-timeout: 600000

# ============================================================
# 分布式重试平台客户端配置
#
# 模式一：Remote 模式（默认，依赖 retry-server）
#   将下面 standalone 部分注释掉，取消 remote 部分注释即可
# ============================================================
#retry:
#  client:
#    mode: remote                          # 远程模式（默认）
#    server-url: http://localhost:8080     # ElecCloud Server 地址
#    enabled: true
#    api-key: demo-key-12345678
#    mq-type: REDIS
#    queue-name: retry.delayed.queue

# ============================================================
# 模式二：Standalone 模式（无需 retry-server，直接操作本地 DB）
#
# 接入步骤（3步完成）：
#   1. 在你的 DB 中执行 standalone-retry-schema.sql 建表
#   2. 在 @RetryableTask 注解中声明策略（maxRetryCount/retryIntervals/hookClass）
#   3. 不需要启动 retry-server，也不需要配置 scenes 列表
#
# 关于 scenes 配置：
#   - 从 v1.1+ 起，scenes 配置为【可选】。策略可直接在注解中声明（零 YAML）。
#   - 若同一 sceneType 在 YAML 中有 scenes 配置，则 YAML 值会覆盖注解值，
#     可用于运维时动态调整重试策略而无需重新打包部署。
#   - 若两处都未配置，使用 SDK 内置默认值（maxRetryCount=3, retryIntervals="1,3,5"）
# ============================================================
retry:
  client:
    mode: standalone                      # ← 开启 Standalone 模式
    enabled: true
    mq-type: REDIS
    queue-name: retry.delayed.queue
    consumer-batch-size: 10              # 每轮从延时队列拉取的消息批量大小，可按负载调整

    # ★ 以下 scenes 配置可完全省略（注解已声明策略）
    # 保留这里仅作为"运维覆盖"示例——当需要临时调整某场景的重试次数/间隔，
    # 直接修改此处 YAML 并重启，无需重新打包 jar
    scenes:
      # 【覆盖示例】在生产上临时将退款场景改为更保守的策略（覆盖代码注解值）
      # - scene-type: 10
      #   scene-name: 退款场景（生产覆盖）
      #   max-retry-count: 5
      #   retry-intervals: "1,5,10,30,60"   # 分钟，逗号分隔整数
      #   hook-class: com.retry.platform.example.hook.DemoRefundHook

      # 生产级退款场景（按真实间隔）
      - scene-type: 1
        scene-name: 电商退款场景
        retry-intervals: "1,5,10,30"       # 分钟，逗号分隔整数
        max-retry-count: 4
        hook-class: com.retry.platform.example.hook.DemoRefundHook

      # 生产级结算场景
      - scene-type: 2
        scene-name: 酒店结算场景
        backoff-strategy: LINEAR
        backoff-base: 2
        max-retry-count: 5
        hook-class: com.retry.platform.example.hook.SettlementRetryHook

      # 生产级库存场景
      - scene-type: 3
        scene-name: 库存同步场景
        backoff-strategy: EXPONENTIAL
        backoff-base: 1
        max-retry-count: 5
        hook-class: com.retry.platform.example.hook.InventoryRetryHook

# Demo 应用自身地址（业务服务调用 MockAPI 时使用）
app:
  self-url: http://localhost:8082

# 日志配置（统一输出到工程根目录 logs/ 文件夹）
logging:
  file:
    name: logs/retry-example.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/retry-example-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
  level:
    com.retry.platform: INFO
    org.springframework: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
